<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>Policies · Keeply</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#5f6368;--line:#e3e3e8;--accent:#d6336c;--th:#f6f6f8}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ececf0;--muted:#a0a0a8;--line:#2c2c32;--accent:#ff6b9a;--th:#1c1c20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;line-height:1.3;margin:.2em 0 .6em}
h2{font-size:1.25rem;margin:2em 0 .6em;padding-top:.4em;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.6em 0 .4em}
a{color:var(--accent);word-break:break-word}
hr{display:none}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1em 0}
table{border-collapse:collapse;min-width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--th)}
code{font-size:.9em;background:var(--th);padding:1px 4px;border-radius:4px}
ul,ol{padding-left:1.4em}
li{margin:.25em 0}
/* 상단 언어 전환: 앱 WebView 에서 손가락으로 누르기 쉬운 크기 */
.lang-switch{display:flex;justify-content:flex-end;gap:6px;margin:0 0 8px}
.lang-switch a,.lang-switch span{display:inline-block;min-height:36px;padding:7px 14px;border:1px solid var(--line);border-radius:18px;font-size:.9rem;line-height:1.4;text-decoration:none}
.lang-switch span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
footer{max-width:860px;margin:0 auto;padding:16px 16px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer a{margin-right:14px}
</style>
</head>
<body>
<main>

<h1 id="keeply-policies">Keeply policies</h1><h2 id="english">English</h2><ul><li><a href="privacy-policy.html">Privacy Policy</a></li><li><a href="terms-of-use.html">Terms of Use</a></li><li><a href="cookie-policy.html">Cookie and Tracking Technologies Policy</a></li></ul><h2 id="korean">한국어</h2><ul><li><a href="ko/privacy-policy.html">개인정보처리방침</a></li><li><a href="ko/terms-of-use.html">이용약관</a></li><li><a href="ko/cookie-policy.html">쿠키 및 추적 기술 정책</a></li></ul>
</main>
<footer></footer>
</body>
</html>
